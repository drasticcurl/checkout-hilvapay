<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Monograma "h": cuadrado redondeado en el casi-negro del panel (#18181B) con la
    letra armada con tres rectángulos. Rectángulos y no un <text>: un favicon no
    puede depender de que la fuente esté cargada, y no puede depender de paths
    dibujados a ojo.
  -->
  <rect width="32" height="32" rx="7" fill="#18181B" />
  <g fill="#FFFFFF">
    <rect x="9.5" y="6" width="3.6" height="20" rx="1.2" />
    <rect x="9.5" y="13.2" width="13" height="3.6" rx="1.2" />
    <rect x="18.9" y="13.2" width="3.6" height="12.8" rx="1.2" />
  </g>
</svg>
